<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oneshot Royale</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1020; }
    canvas {
        margin: 0; padding: 0;
        width: 100vw; height: 100vh;
        display: block;
        position: absolute; top: 0; left: 0;
        z-index: 0;
    }
    #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ffd24d; font: 700 24px 'Trebuchet MS', sans-serif; letter-spacing: 2px;
        background: #0a1020; z-index: 1; pointer-events: none;
    }
</style>
</head>
<body>
<div id="loading">LOADING…</div>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js"></script>
<script>
    load("game.wasm");
    // hide the loading veil once the wasm paints its first frame
    const veil = document.getElementById("loading");
    const iv = setInterval(() => {
        if (typeof wasm_exports !== "undefined" && wasm_exports) {
            veil.style.display = "none";
            clearInterval(iv);
        }
    }, 100);
</script>
</body>
</html>
